<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STAR FIGHTER — K' Arcade</title>
<style>
  :root{ --red:#FF2D34; --blue:#4FB0FF; --green:#46E36B; --amber:#E0B95E; --ink:#EAF0F8; --muted:#8590A4; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ background:radial-gradient(800px 600px at 50% -10%, rgba(79,176,255,.12), transparent 60%), #05060A;
    color:var(--ink); font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; padding:14px; gap:12px; overflow:hidden; }
  h1.kick{font-size:12px; letter-spacing:.4em; color:var(--amber); text-transform:uppercase; font-weight:700;}
  .stage{ position:relative; width:min(460px, 96vw); aspect-ratio:46/72; max-height:84vh;
    border:1px solid rgba(79,176,255,.3); border-radius:14px; overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,45,52,.15), 0 24px 60px rgba(0,0,0,.6); background:#04040A; touch-action:none;}
  canvas{display:block; width:100%; height:100%;}
  /* HUD overlays */
  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    gap:14px; padding:28px; background:radial-gradient(120% 90% at 50% 40%, rgba(8,10,20,.7), rgba(4,4,10,.92)); z-index:5;}
  .overlay.hidden{display:none;}
  .overlay .title{font-size:clamp(30px,9vw,46px); font-weight:800; letter-spacing:.12em; color:#fff;
    text-shadow:0 0 30px rgba(79,176,255,.5);}
  .overlay .title b{color:var(--red);}
  .overlay .sub{font-size:13px; color:var(--muted); letter-spacing:.06em; line-height:1.9; max-width:320px;}
  .overlay .big{font-size:14px; color:var(--amber); letter-spacing:.2em;}
  .btn{margin-top:6px; font-size:14px; font-weight:800; letter-spacing:.14em; color:#04040A;
    background:linear-gradient(135deg,var(--blue),#2f7fd0); border:none; border-radius:10px; padding:14px 30px; cursor:pointer;
    box-shadow:0 0 22px rgba(79,176,255,.5); animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 16px rgba(79,176,255,.4);}50%{box-shadow:0 0 30px rgba(79,176,255,.9);}}
  .score-final{font-size:34px; font-weight:800; color:var(--green); text-shadow:0 0 20px rgba(70,227,107,.5);}
  .mute{position:absolute; top:8px; right:10px; z-index:6; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.15);
    color:var(--ink); border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:15px;}
  .hint{font-size:11px; color:var(--muted); letter-spacing:.08em;}
  @media(prefers-reduced-motion:reduce){.btn{animation:none;}}
</style>
</head>
<body>
  <h1 class="kick">K' Arcade — Star Wars style</h1>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="mute" id="mute" title="サウンド">🔊</button>

    <div class="overlay" id="startScr">
      <div class="title">STAR <b>FIGHTER</b></div>
      <div class="sub">X-wingを操り、迫りくるTIEファイターを撃て。<br>シールドが尽きる前に、どこまで生き残れるか。</div>
      <div class="sub" style="color:#aeb8ca;">操作 — マウス / 指でなぞって移動<br>（PCは ← → / A D でも可）<br>射撃は自動</div>
      <button class="btn" id="startBtn">▶ 出撃する</button>
    </div>

    <div class="overlay hidden" id="overScr">
      <div class="big">MISSION FAILED</div>
      <div class="score-final" id="finalScore">0</div>
      <div class="sub" id="overMsg">撃墜数 —</div>
      <button class="btn" id="retryBtn">↻ 再出撃</button>
    </div>
  </div>
  <div class="hint">▸ なぞって回避・自動射撃 ／ TIEを撃墜してスコアを稼ぐ</div>

<script>
(function(){
  var cv=document.getElementById('cv'), x=cv.getContext('2d');
  var stage=document.getElementById('stage');
  var startScr=document.getElementById('startScr'), overScr=document.getElementById('overScr');
  var startBtn=document.getElementById('startBtn'), retryBtn=document.getElementById('retryBtn');
  var finalScore=document.getElementById('finalScore'), overMsg=document.getElementById('overMsg');
  var muteBtn=document.getElementById('mute');

  var W=460,H=720,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    var r=stage.getBoundingClientRect();
    W=r.width; H=r.height;
    cv.width=W*DPR; cv.height=H*DPR; x.setTransform(DPR,0,0,DPR,0,0);
  }

  // ---- audio ----
  var actx=null, muted=false;
  function snd(freq,dur,type,vol,slideTo){
    if(muted) return;
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=type||'square'; o.frequency.value=freq;
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime+dur);
      g.gain.value=vol||0.04; o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
      o.stop(actx.currentTime+dur);
    }catch(e){}
  }
  var sLaser=function(){snd(900,0.07,'square',0.025,420);};
  var sBoom =function(){snd(160,0.22,'sawtooth',0.05,40);};
  var sHit  =function(){snd(240,0.18,'square',0.06,90);};

  muteBtn.onclick=function(){ muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; };

  // ---- state ----
  var state='start';
  var player, bullets, ebullets, enemies, stars, parts, items;
  var powerLevel=1, maxShields=5;
  var score, shields, kills, wave, spawnT, spawnEvery, fireT, shake, flash, tFrame;
  var boss=null, bossCount=0, warning=0, lastBossWave=0;
  var target=null; // pointer target x
  var keys={};

  function reset(){
    player={x:W/2, y:H-70, w:34, h:30, sp:7};
    bullets=[]; ebullets=[]; enemies=[]; parts=[]; items=[];
    powerLevel=1; maxShields=5;
    stars=[]; for(var i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+0.4});
    score=0; shields=3; kills=0; wave=1;
    spawnEvery=64; spawnT=30; fireT=0; shake=0; flash=0; tFrame=0;
    boss=null; bossCount=0; warning=0; lastBossWave=0;
    target=null;
  }

  function start(){ resize(); reset(); state='play'; startScr.classList.add('hidden'); overScr.classList.add('hidden'); }
  function gameOver(){
    state='over'; finalScore.textContent=score;
    overMsg.textContent='撃墜 '+kills+' 機 ／ WAVE '+wave+' 到達';
    overScr.classList.remove('hidden'); sBoom();
  }

  startBtn.onclick=start; retryBtn.onclick=start;

  // ---- input ----
  function setTargetFromEvent(e){
    var r=cv.getBoundingClientRect();
    var p=(e.touches&&e.touches[0])?e.touches[0]:e;
    target=(p.clientX-r.left);
  }
  cv.addEventListener('pointermove',function(e){ if(state==='play'){ setTargetFromEvent(e); } });
  cv.addEventListener('pointerdown',function(e){ if(state==='play'){ setTargetFromEvent(e); } });
  cv.addEventListener('touchmove',function(e){ if(state==='play'){ setTargetFromEvent(e); e.preventDefault(); } },{passive:false});
  window.addEventListener('keydown',function(e){
    keys[e.key]=true;
    if((e.key===' '||e.key==='Enter')){ if(state==='start'||state==='over') start(); }
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)>=0) e.preventDefault();
  });
  window.addEventListener('keyup',function(e){ keys[e.key]=false; });

  // ---- spawning ----
  function spawnEnemy(){
    var w=30+Math.random()*8;
    enemies.push({ x:30+Math.random()*(W-60), y:-30, w:w, h:w*0.86,
      vy:1.1+wave*0.18+Math.random()*0.6, vx:(Math.random()-0.5)*1.6, hp:1, cool:60+Math.random()*80,
      phase:Math.random()*6.28 });
  }
  function fire(){
    var p=powerLevel, y=player.y, cx=player.x;
    if(p<=1){ bullets.push({x:cx,y:y-18,vy:-9,vx:0}); }
    else if(p===2){ bullets.push({x:cx-7,y:y-14,vy:-9,vx:0}); bullets.push({x:cx+7,y:y-14,vy:-9,vx:0}); }
    else if(p===3){ bullets.push({x:cx,y:y-18,vy:-9,vx:0}); bullets.push({x:cx-9,y:y-12,vy:-8.6,vx:-1.7}); bullets.push({x:cx+9,y:y-12,vy:-8.6,vx:1.7}); }
    else { bullets.push({x:cx-6,y:y-16,vy:-9.4,vx:0}); bullets.push({x:cx+6,y:y-16,vy:-9.4,vx:0}); bullets.push({x:cx-13,y:y-10,vy:-8.4,vx:-2.4}); bullets.push({x:cx+13,y:y-10,vy:-8.4,vx:2.4}); }
    sLaser();
  }
  function dropItem(px,py,force){
    if(!force && Math.random()>0.13) return;
    var type=Math.random()<0.4 ? 'shield' : 'power';
    items.push({x:px,y:py,vy:1.5,type:type,ph:Math.random()*6.28});
  }
  function applyItem(type){
    var col;
    if(type==='shield'){ if(shields<maxShields) shields++; else score+=50; col='#4FB0FF'; }
    else { if(powerLevel<4) powerLevel++; else score+=50; col='#46E36B'; }
    for(var i=0;i<10;i++){ var a=Math.random()*6.28,s=Math.random()*2.4+1; parts.push({x:player.x,y:player.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.8,col:col}); }
    snd(680,0.12,'triangle',0.05,1040);
  }
  function boom(px,py,col){
    for(var i=0;i<14;i++){ var a=Math.random()*6.28, s=Math.random()*3+1;
      parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col}); }
    shake=8;
  }

  // ---- update ----
  function update(){
    tFrame++;
    // stars
    for(var i=0;i<stars.length;i++){ var s=stars[i]; s.y+=s.z*(state==='play'?2.2:0.8); if(s.y>H){s.y=0;s.x=Math.random()*W;} }
    if(state!=='play') return;

    // player move
    if(keys['ArrowLeft']||keys['a']||keys['A']) target=(target==null?player.x:target)-player.sp;
    if(keys['ArrowRight']||keys['d']||keys['D']) target=(target==null?player.x:target)+player.sp;
    if(target!=null){ var dx=target-player.x; player.x+=dx*0.25; }
    player.x=Math.max(player.w/2, Math.min(W-player.w/2, player.x));

    // auto fire
    fireT--; if(fireT<=0){ fire(); fireT=Math.max(6, 11-powerLevel); }

    // bullets
    for(var i=bullets.length-1;i>=0;i--){ var b=bullets[i]; b.y+=b.vy; b.x+=(b.vx||0); if(b.y<-10||b.x<-12||b.x>W+12) bullets.splice(i,1); }
    for(var i=ebullets.length-1;i>=0;i--){ var eb=ebullets[i]; eb.y+=eb.vy; eb.x+=eb.vx||0; if(eb.y>H+10) ebullets.splice(i,1); }

    // spawn（ボス出現中は雑魚を止める）
    if(!boss){ spawnT--; if(spawnT<=0){ spawnEnemy(); spawnT=spawnEvery; } }
    if(warning>0) warning--;
    updateBoss();

    // enemies
    for(var i=enemies.length-1;i>=0;i--){ var en=enemies[i];
      en.y+=en.vy; en.x+=Math.sin(tFrame*0.04+en.phase)*1.2 + en.vx*0.3;
      en.x=Math.max(en.w/2,Math.min(W-en.w/2,en.x));
      en.cool--; if(en.cool<=0 && en.y>0 && en.y<H*0.7){ ebullets.push({x:en.x,y:en.y+en.h/2,vy:4+wave*0.1, vx:(player.x-en.x)*0.006}); en.cool=70+Math.random()*70; }
      if(en.y>H+30){ enemies.splice(i,1); continue; }
      // collide with player
      if(Math.abs(en.x-player.x)<(en.w/2+player.w/2-6) && Math.abs(en.y-player.y)<(en.h/2+player.h/2-6)){
        enemies.splice(i,1); boom(en.x,en.y,'#FF2D34'); hurt(); continue;
      }
    }

    // player bullets vs enemies
    for(var i=bullets.length-1;i>=0;i--){ var b=bullets[i];
      for(var j=enemies.length-1;j>=0;j--){ var en=enemies[j];
        if(Math.abs(b.x-en.x)<en.w/2 && Math.abs(b.y-en.y)<en.h/2){
          bullets.splice(i,1); en.hp--; if(en.hp<=0){ enemies.splice(j,1); boom(en.x,en.y,'#46E36B'); dropItem(en.x,en.y,false); score+=10; kills++; sBoom();
            if(kills%10===0){ wave++; spawnEvery=Math.max(26,spawnEvery-6);
              if(wave%3===0 && !boss && wave!==lastBossWave) triggerBoss(); } }
          break;
        }
      }
    }

    // player bullets vs boss
    if(boss && !boss.entering){
      for(var i=bullets.length-1;i>=0;i--){ var bl=bullets[i];
        if(Math.abs(bl.x-boss.x)<boss.w/2 && Math.abs(bl.y-boss.y)<boss.h/2){
          bullets.splice(i,1); boss.hp--;
          parts.push({x:bl.x,y:bl.y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:0.6,col:'#9FE8FF'});
          if(boss.hp<=0){ defeatBoss(); break; }
        }
      }
    }

    // enemy bullets vs player
    for(var i=ebullets.length-1;i>=0;i--){ var eb=ebullets[i];
      if(Math.abs(eb.x-player.x)<player.w/2-4 && Math.abs(eb.y-player.y)<player.h/2-2){
        ebullets.splice(i,1); hurt();
      }
    }

    // items（落下・取得）
    for(var i=items.length-1;i>=0;i--){ var it=items[i]; it.y+=it.vy;
      if(it.y>H+16){ items.splice(i,1); continue; }
      if(Math.abs(it.x-player.x)<player.w/2+12 && Math.abs(it.y-player.y)<player.h/2+12){ applyItem(it.type); items.splice(i,1); }
    }

    // particles
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=0.03; if(p.life<=0) parts.splice(i,1); }
    if(shake>0) shake*=0.86; if(flash>0) flash-=0.06;
    score += 0; // survival handled by kills
  }

  function hurt(){ shields--; flash=1; shake=10; sHit(); if(shields<=0) gameOver(); }

  // ---- boss ----
  function triggerBoss(){
    lastBossWave=wave;
    var type=(bossCount%2===0)?'sith':'capital'; bossCount++; warning=120;
    if(type==='sith'){
      var hp=22+wave*4;
      boss={type:'sith', x:W/2, y:-60, ty:120, w:78, h:56, hp:hp, max:hp, cool:70, phase:0, entering:true};
    } else {
      var hp2=44+wave*6;
      boss={type:'capital', x:W/2, y:-130, ty:104, w:Math.min(W*0.82,360), h:124, hp:hp2, max:hp2, cool:60, phase:0, entering:true};
    }
  }
  function updateBoss(){
    var b=boss; if(!b) return;
    if(b.entering){ b.y+=2.6; if(b.y>=b.ty){ b.y=b.ty; b.entering=false; } return; }
    b.phase+=0.02;
    if(b.type==='sith'){
      b.x=W/2+Math.sin(b.phase)*(W/2-46);
      b.cool--; if(b.cool<=0){
        var ang=Math.atan2(player.y-b.y, player.x-b.x);
        for(var k=-2;k<=2;k++){ var a=ang+k*0.17; ebullets.push({x:b.x,y:b.y+18,vy:Math.sin(a)*5+1.5,vx:Math.cos(a)*5}); }
        b.cool=44; sLaser();
      }
    } else {
      b.x=W/2+Math.sin(b.phase*0.6)*(W*0.13);
      b.cool--; if(b.cool<=0){
        for(var k=0;k<3;k++){ var px=b.x+(Math.random()-0.5)*b.w*0.78; ebullets.push({x:px,y:b.y+b.h/2,vy:4.4+wave*0.08,vx:(player.x-px)*0.003}); }
        b.cool=28;
      }
    }
  }
  function defeatBoss(){
    var b=boss;
    for(var k=0;k<6;k++) boom(b.x+(Math.random()-0.5)*b.w*0.7, b.y+(Math.random()-0.5)*b.h*0.7, k%2?'#FF2D34':'#46E36B');
    score += (b.type==='sith'?200:400); shake=18; sBoom();
    items.push({x:b.x-20,y:b.y,vy:1.4,type:'shield',ph:0});
    items.push({x:b.x+20,y:b.y,vy:1.4,type:'power',ph:1});
    boss=null;
  }

  // ---- draw ----
  function drawShip(px,py){
    x.save(); x.translate(px,py);
    // engine glow
    x.fillStyle='rgba(79,176,255,.5)'; x.beginPath(); x.ellipse(0,16,6,10,0,0,6.28); x.fill();
    // body (X-wing-ish)
    x.fillStyle='#D7DEE8'; x.strokeStyle='#9FB0C4'; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(0,-18); x.lineTo(7,8); x.lineTo(0,4); x.lineTo(-7,8); x.closePath(); x.fill(); x.stroke();
    // wings (S-foils)
    x.strokeStyle='#AEB9C8'; x.lineWidth=3;
    x.beginPath(); x.moveTo(-5,2); x.lineTo(-18,-8); x.moveTo(-5,8); x.lineTo(-18,14);
    x.moveTo(5,2); x.lineTo(18,-8); x.moveTo(5,8); x.lineTo(18,14); x.stroke();
    // wingtip lights
    x.fillStyle='#FF2D34'; x.beginPath(); x.arc(-18,-8,1.8,0,6.28); x.arc(18,14,1.8,0,6.28); x.fill();
    x.fillStyle='#4FB0FF'; x.beginPath(); x.arc(18,-8,1.8,0,6.28); x.arc(-18,14,1.8,0,6.28); x.fill();
    x.restore();
  }
  function drawTie(en){
    x.save(); x.translate(en.x,en.y); var w=en.w;
    x.strokeStyle='#C7D2E0'; x.fillStyle='#10151c'; x.lineWidth=2.4;
    // side panels
    x.fillRect(-w/2,-w/2,5,w); x.strokeRect(-w/2,-w/2,5,w);
    x.fillRect(w/2-5,-w/2,5,w); x.strokeRect(w/2-5,-w/2,5,w);
    // struts
    x.beginPath(); x.moveTo(-w/2+5,0); x.lineTo(w/2-5,0); x.stroke();
    // cockpit ball
    x.fillStyle='#1a2230'; x.beginPath(); x.arc(0,0,w*0.26,0,6.28); x.fill(); x.stroke();
    x.fillStyle='rgba(255,45,52,.7)'; x.beginPath(); x.arc(0,0,w*0.1,0,6.28); x.fill();
    x.restore();
  }
  function drawBoss(b){
    x.save(); x.translate(b.x,b.y);
    if(b.type==='sith'){
      // 折れ翼ソーラーパネル ×2
      [-1,1].forEach(function(s){
        x.save(); x.translate(s*b.w*0.30,0); x.rotate(s*0.42);
        x.fillStyle='#10151d'; x.strokeStyle='#cfd8e6'; x.lineWidth=2.5;
        x.fillRect(-8,-b.h*0.62,16,b.h*1.24); x.strokeRect(-8,-b.h*0.62,16,b.h*1.24);
        x.strokeStyle='rgba(130,150,180,.5)'; x.lineWidth=1;
        for(var i=-3;i<=3;i++){ x.beginPath(); x.moveTo(-8,i*9); x.lineTo(8,i*9); x.stroke(); }
        x.restore();
      });
      x.strokeStyle='#cfd8e6'; x.lineWidth=3.5; x.beginPath(); x.moveTo(-b.w*0.26,0); x.lineTo(b.w*0.26,0); x.stroke();
      x.fillStyle='#1a2230'; x.strokeStyle='#cfd8e6'; x.lineWidth=2.5; x.beginPath(); x.arc(0,0,15,0,6.28); x.fill(); x.stroke();
      x.fillStyle='rgba(255,45,52,.9)'; x.beginPath(); x.arc(0,0,5.5,0,6.28); x.fill();
    } else {
      // スター・デストロイヤー風の楔（先端が下）
      var w=b.w,h=b.h;
      x.fillStyle='#2b323d'; x.strokeStyle='#9aa6b8'; x.lineWidth=2;
      x.beginPath(); x.moveTo(-w/2,-h/2); x.lineTo(w/2,-h/2); x.lineTo(0,h/2); x.closePath(); x.fill(); x.stroke();
      // 船体ライン
      x.strokeStyle='rgba(150,165,190,.35)'; x.lineWidth=1;
      for(var i=1;i<=4;i++){ var t=i/5; x.beginPath(); x.moveTo(-w/2*(1-t),-h/2+h*t); x.lineTo(w/2*(1-t),-h/2+h*t); x.stroke(); }
      // ブリッジ塔
      x.fillStyle='#3a4350'; x.fillRect(-12,-h/2-12,24,14); x.strokeRect(-12,-h/2-12,24,14);
      x.fillStyle='#9FE8FF'; x.fillRect(-8,-h/2-9,16,3);
      // エンジン発光（上端）
      x.fillStyle='rgba(120,180,255,.55)';
      for(var i=-2;i<=2;i++){ x.beginPath(); x.ellipse(i*14,-h/2-1,5,3,0,0,6.28); x.fill(); }
      // 砲門（赤）
      x.fillStyle='#FF3B3B';
      for(var i=-3;i<=3;i++){ x.beginPath(); x.arc(i*(w*0.12),-h*0.1,2,0,6.28); x.fill(); }
    }
    x.restore();
  }
  function drawItem(it){
    x.save(); x.translate(it.x, it.y+Math.sin(tFrame*0.1+it.ph)*2);
    var col=it.type==='shield'?'#4FB0FF':'#46E36B';
    x.shadowColor=col; x.shadowBlur=12;
    x.fillStyle='rgba(4,6,14,.7)'; x.strokeStyle=col; x.lineWidth=2;
    x.beginPath(); x.arc(0,0,11,0,6.28); x.fill(); x.stroke();
    x.shadowBlur=0; x.strokeStyle=col; x.lineWidth=2.4; x.lineCap='round';
    if(it.type==='shield'){ x.beginPath(); x.moveTo(0,-5); x.lineTo(0,5); x.moveTo(-5,0); x.lineTo(5,0); x.stroke(); }
    else { x.beginPath(); x.moveTo(-5,2); x.lineTo(0,-5); x.lineTo(5,2); x.stroke(); x.beginPath(); x.moveTo(-5,7); x.lineTo(0,0); x.lineTo(5,7); x.stroke(); }
    x.restore();
  }
  function bolt(b,col){ x.strokeStyle=col; x.lineWidth=3.4; x.lineCap='round'; x.shadowColor=col; x.shadowBlur=10;
    x.beginPath(); x.moveTo(b.x,b.y); x.lineTo(b.x+(b.vx||0)*1.4, b.y+ (b.vy<0?10:-10)); x.stroke(); x.shadowBlur=0; }

  function draw(){
    var sx = shake>0.5 ? (Math.random()-0.5)*shake : 0;
    var sy = shake>0.5 ? (Math.random()-0.5)*shake : 0;
    x.save(); x.translate(sx,sy);
    x.clearRect(-20,-20,W+40,H+40);
    // bg
    x.fillStyle='#04040A'; x.fillRect(-20,-20,W+40,H+40);
    // stars
    for(var i=0;i<stars.length;i++){ var s=stars[i]; x.globalAlpha=0.3+s.z*0.3; x.fillStyle='#cfe0ff';
      x.fillRect(s.x, s.y, s.z, s.z+ (state==='play'?s.z:0)); }
    x.globalAlpha=1;

    if(state==='play'||state==='over'){
      for(var i=0;i<ebullets.length;i++) bolt(ebullets[i],'#FF3B3B');
      for(var i=0;i<bullets.length;i++) bolt(bullets[i],'#46E36B');
      for(var i=0;i<enemies.length;i++) drawTie(enemies[i]);
      if(boss) drawBoss(boss);
      for(var i=0;i<items.length;i++) drawItem(items[i]);
      for(var i=0;i<parts.length;i++){ var p=parts[i]; x.globalAlpha=Math.max(0,p.life); x.fillStyle=p.col;
        x.fillRect(p.x-1.5,p.y-1.5,3,3); } x.globalAlpha=1;
      if(state==='play') drawShip(player.x,player.y);
    }
    x.restore();

    // damage flash
    if(flash>0){ x.fillStyle='rgba(255,45,52,'+(flash*0.4)+')'; x.fillRect(0,0,W,H); }

    // HUD
    if(state==='play'){
      x.fillStyle='#EAF0F8'; x.font='bold 16px monospace'; x.textAlign='left';
      x.fillText('SCORE '+score, 12, 24);
      x.fillStyle='#46E36B'; x.font='bold 12px monospace';
      x.fillText('PWR x'+powerLevel, 12, 42);
      x.textAlign='center'; x.fillStyle='#E0B95E'; x.font='bold 12px monospace';
      x.fillText('WAVE '+wave, W/2, 22);
      // shields
      x.textAlign='right'; x.font='bold 16px monospace';
      for(var i=0;i<maxShields;i++){ x.fillStyle = i<shields ? '#4FB0FF':'#2a3340';
        x.fillText('▮', W-12-i*15, 24); }
      // ボスHPバー
      if(boss){
        var bw=W*0.6, bx0=(W-bw)/2, by=40;
        x.fillStyle='rgba(0,0,0,.5)'; x.fillRect(bx0-2,by-2,bw+4,9);
        x.fillStyle='#FF2D34'; x.fillRect(bx0,by, bw*Math.max(0,boss.hp/boss.max), 5);
        x.strokeStyle='rgba(255,45,52,.7)'; x.lineWidth=1; x.strokeRect(bx0,by,bw,5);
        x.fillStyle='#FF6B6B'; x.font='bold 10px monospace'; x.textAlign='center';
        x.fillText(boss.type==='sith'?'SITH — TIE ADVANCED':'IMPERIAL CAPITAL SHIP', W/2, by-5);
      }
      // 出現警告
      if(warning>0 && Math.floor(warning/8)%2===0){
        x.fillStyle='#FF2D34'; x.font='bold 22px monospace'; x.textAlign='center';
        x.fillText('⚠ WARNING ⚠', W/2, H*0.42);
      }
    }
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  window.addEventListener('resize', function(){ resize(); });
  resize(); reset(); state='start';
  loop();
})();
</script>
</body>
</html>
