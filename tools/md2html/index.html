<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown → HTML 変換 — K' Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0D1B2A; --surface: #142233; --surface2: #1A2C42;
      --border: #243850; --blue: #5B8DEF; --text: #F0F4F8;
      --muted: #7A90A8; --light: #A8BCCF; --green: #4CAF82;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif;
      height: 100vh; display: flex; flex-direction: column;
    }

    /* ─── Header ─── */
    .header {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    }
    .header .back {
      font-size: 12px; color: var(--blue); text-decoration: none;
      letter-spacing: 0.06em;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header .badge {
      font-size: 11px; color: var(--muted); margin-left: auto;
    }

    /* ─── Toolbar ─── */
    .toolbar {
      padding: 10px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      background: var(--surface);
    }
    .btn {
      padding: 6px 14px; border-radius: 6px; font-size: 12px;
      font-weight: 600; border: 1px solid var(--border);
      background: var(--surface2); color: var(--light);
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .btn:hover { border-color: var(--blue); color: var(--text); }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn.primary:hover { opacity: 0.88; }
    .sep { width: 1px; height: 20px; background: var(--border); }
    .mode-label { font-size: 12px; color: var(--muted); }
    .toggle-wrap { display: flex; gap: 4px; }
    .toggle-btn {
      padding: 5px 12px; border-radius: 5px; font-size: 12px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .toggle-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* ─── Main ─── */
    .main {
      flex: 1; display: flex; overflow: hidden;
    }
    .pane {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .pane:last-child { border-right: none; }
    .pane-label {
      padding: 8px 16px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase;
      border-bottom: 1px solid var(--border); background: var(--surface);
      flex-shrink: 0;
    }
    textarea {
      flex: 1; resize: none; border: none; outline: none;
      background: var(--bg); color: var(--text);
      font-family: 'SFMono-Regular', 'Consolas', 'Menlo', monospace;
      font-size: 13px; line-height: 1.7; padding: 20px;
      tab-size: 2;
    }
    textarea::placeholder { color: var(--muted); }

    /* ─── Preview ─── */
    .preview-wrap {
      flex: 1; overflow-y: auto; padding: 20px 28px;
      background: var(--bg);
    }
    .preview-wrap.html-mode {
      background: var(--surface2);
    }
    .preview-content {
      max-width: 680px; line-height: 1.8; color: var(--text);
    }
    .html-output {
      font-family: 'SFMono-Regular', monospace; font-size: 12px;
      color: #A8C7FA; white-space: pre-wrap; word-break: break-all;
      line-height: 1.6;
    }

    /* ─── Markdown rendered styles ─── */
    .preview-content h1, .preview-content h2, .preview-content h3,
    .preview-content h4 { margin: 1.4em 0 0.5em; font-weight: 700; line-height: 1.3; }
    .preview-content h1 { font-size: 1.8em; border-bottom: 2px solid var(--border); padding-bottom: 0.3em; }
    .preview-content h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
    .preview-content h3 { font-size: 1.15em; }
    .preview-content p { margin: 0.8em 0; }
    .preview-content ul, .preview-content ol { padding-left: 1.6em; margin: 0.6em 0; }
    .preview-content li { margin: 0.3em 0; }
    .preview-content code {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.15em 0.4em;
      font-family: 'SFMono-Regular', monospace; font-size: 0.88em; color: #A8C7FA;
    }
    .preview-content pre {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; overflow-x: auto; margin: 1em 0;
    }
    .preview-content pre code {
      background: none; border: none; padding: 0; font-size: 0.92em;
    }
    .preview-content blockquote {
      border-left: 3px solid var(--blue); margin: 1em 0;
      padding: 0.4em 1em; color: var(--light);
      background: var(--surface);
    }
    .preview-content table {
      border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.93em;
    }
    .preview-content th, .preview-content td {
      border: 1px solid var(--border); padding: 8px 12px; text-align: left;
    }
    .preview-content th { background: var(--surface); font-weight: 700; }
    .preview-content tr:nth-child(even) { background: var(--surface); }
    .preview-content a { color: var(--blue); }
    .preview-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
    .preview-content img { max-width: 100%; border-radius: 6px; }

    /* ─── Single pane mode ─── */
    .main.single .pane { display: none; }
    .main.single .pane.visible { display: flex; flex: 1; }

    /* ─── Toast ─── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: #fff; padding: 8px 20px;
      border-radius: 20px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="header">
  <a class="back" href="../../">← K' Lab</a>
  <h1>Markdown → HTML 変換</h1>
  <span class="badge">ブラウザ完結 · サーバー不要</span>
</div>

<div class="toolbar">
  <span class="mode-label">表示:</span>
  <div class="toggle-wrap">
    <button class="toggle-btn active" id="btnSplit" onclick="setLayout('split')">左右分割</button>
    <button class="toggle-btn" id="btnEditor" onclick="setLayout('editor')">編集のみ</button>
    <button class="toggle-btn" id="btnPreview" onclick="setLayout('preview')">プレビューのみ</button>
  </div>
  <div class="sep"></div>
  <span class="mode-label">出力:</span>
  <div class="toggle-wrap">
    <button class="toggle-btn active" id="btnRendered" onclick="setOutputMode('rendered')">レンダリング</button>
    <button class="toggle-btn" id="btnHtml" onclick="setOutputMode('html')">HTML ソース</button>
  </div>
  <div class="sep"></div>
  <button class="btn" onclick="copyHtml()">HTML をコピー</button>
  <button class="btn primary" onclick="downloadHtml()">HTML ダウンロード</button>
</div>

<div class="main" id="main">
  <div class="pane visible" id="paneEditor">
    <div class="pane-label">Markdown</div>
    <textarea id="editor" placeholder="ここに Markdown を入力...

# 見出し1
## 見出し2

**太字** / *斜体* / `コード`

- リスト項目
- リスト項目

> 引用文

| 列1 | 列2 |
|-----|-----|
| A   | B   |
"></textarea>
  </div>

  <div class="pane visible" id="panePreview">
    <div class="pane-label" id="previewLabel">プレビュー</div>
    <div class="preview-wrap" id="previewWrap">
      <div class="preview-content" id="previewContent"></div>
      <pre class="html-output" id="htmlOutput" style="display:none"></pre>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const editor = document.getElementById('editor');
  const previewContent = document.getElementById('previewContent');
  const htmlOutput = document.getElementById('htmlOutput');
  const previewWrap = document.getElementById('previewWrap');
  const main = document.getElementById('main');

  let outputMode = 'rendered';

  marked.setOptions({ breaks: true, gfm: true });

  function render() {
    const md = editor.value;
    const html = marked.parse(md);
    if (outputMode === 'rendered') {
      previewContent.innerHTML = html;
      previewContent.style.display = '';
      htmlOutput.style.display = 'none';
    } else {
      htmlOutput.textContent = html;
      previewContent.style.display = 'none';
      htmlOutput.style.display = '';
    }
  }

  function setOutputMode(mode) {
    outputMode = mode;
    document.getElementById('btnRendered').classList.toggle('active', mode === 'rendered');
    document.getElementById('btnHtml').classList.toggle('active', mode === 'html');
    previewWrap.classList.toggle('html-mode', mode === 'html');
    document.getElementById('previewLabel').textContent = mode === 'rendered' ? 'プレビュー' : 'HTML ソース';
    render();
  }

  function setLayout(mode) {
    ['btnSplit','btnEditor','btnPreview'].forEach(id =>
      document.getElementById(id).classList.remove('active'));
    document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');

    const paneEditor = document.getElementById('paneEditor');
    const panePreview = document.getElementById('panePreview');
    if (mode === 'split') {
      main.classList.remove('single');
      paneEditor.classList.add('visible');
      panePreview.classList.add('visible');
    } else if (mode === 'editor') {
      main.classList.add('single');
      paneEditor.classList.add('visible');
      panePreview.classList.remove('visible');
    } else {
      main.classList.add('single');
      paneEditor.classList.remove('visible');
      panePreview.classList.add('visible');
    }
  }

  function getFullHtml() {
    const html = marked.parse(editor.value);
    return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 24px; line-height: 1.8; color: #1a1a1a; }
    h1, h2, h3 { margin-top: 1.4em; }
    h1 { border-bottom: 2px solid #ddd; padding-bottom: 0.3em; }
    h2 { border-bottom: 1px solid #eee; padding-bottom: 0.2em; }
    code { background: #f5f5f5; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.9em; }
    pre { background: #f5f5f5; padding: 16px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 3px solid #999; margin: 0; padding: 0.4em 1em; color: #555; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f5f5f5; }
    img { max-width: 100%; }
    a { color: #0066cc; }
  </style>
</head>
<body>
${html}
</body>
</html>`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyHtml() {
    navigator.clipboard.writeText(getFullHtml()).then(() => showToast('コピーしました'));
  }

  function downloadHtml() {
    const blob = new Blob([getFullHtml()], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'document.html';
    a.click();
    showToast('ダウンロード完了');
  }

  editor.addEventListener('input', render);
  render();
</script>
</body>
</html>
